name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up CI Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Record environment and revisions
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python --version
          git --version
          git rev-parse HEAD
          python -c 'import os; print("PR head:", os.environ.get("PR_HEAD_SHA") or "not a PR event")'
      - name: Install isolated validation dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r tools/requirements-ci.txt
      - name: Regression tests for repository gates
        run: .venv/bin/python -m unittest discover -s tools/tests -v
      - name: Validate repository and changed whitespace
        run: .venv/bin/python tools/check_repository.py --event "$GITHUB_EVENT_PATH"
      - name: Validate actual PR description
        if: github.event_name == 'pull_request'
        run: .venv/bin/python tools/check_pr.py --event "$GITHUB_EVENT_PATH"
      - name: Verify pinned repository set as data
        if: github.repository == 'eyleme-dev/devguide'
        run: .venv/bin/python tools/check_workspace.py --fetch
  rust-checks:
    name: rust-checks
    if: github.repository == 'eyleme-dev/eyleme' || github.repository == 'eyleme-dev/eyleme-examples' || github.repository == 'eyleme-dev/eyleme-evals'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up CI Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Run stage-aware native and Wasm gates
        run: python tools/check_rust.py --provision

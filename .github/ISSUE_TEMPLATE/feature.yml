name: Feature
description: Describe a concrete user need
title: '[Feature] '
body:
- type: markdown
  attributes:
    value: Read CONTRIBUTING.md before implementation. Write this issue in English;
      documentation is available in English and Turkish.
- type: textarea
  id: need
  attributes:
    label: Need
    description: Who needs what outcome, and why?
  validations:
    required: true
- type: textarea
  id: targets
  attributes:
    label: Targets and budget
    description: Browser/Linux, hardware assumptions, task/time/model-call limits.
      Unknown values may remain unknown until triage.
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: Acceptance criteria
    description: Observable scenarios and results; include failure cases.
  validations:
    required: true
- type: textarea
  id: scope
  attributes:
    label: Scope and exclusions
    description: Affected paths/modules; production dependencies, permissions and
      data boundaries.
  validations:
    required: true
- type: textarea
  id: verification
  attributes:
    label: Verification plan
    description: Commands, tests and required hardware; mark unavailable checks not_run.
  validations:
    required: true
- type: checkboxes
  id: hygiene
  attributes:
    label: Submission
    options:
    - label: I removed secrets and private data.
      required: true
    - label: I understand this issue is a proposal, not execution authority.
      required: true
